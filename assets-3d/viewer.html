<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Velari stack — GLB viewer</title>
<style>
  html,body{margin:0;height:100%;background:#0a0710;overflow:hidden}
  canvas{display:block}
  #hud{position:fixed;left:16px;top:14px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
       color:#e8d5a3;letter-spacing:.06em;text-transform:uppercase;pointer-events:none;opacity:.75}
  #err{position:fixed;inset:0;display:none;place-items:center;color:#f4d68c;
       font:14px/1.7 ui-monospace,monospace;padding:40px;text-align:center;white-space:pre-wrap}
</style>
</head>
<body>
<div id="hud">drag to orbit · scroll to zoom · loading…</div>
<div id="err"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const hud = document.getElementById('hud');
const errBox = document.getElementById('err');
const fail = (m) => { errBox.style.display='grid'; errBox.textContent = m; hud.style.display='none'; };
window.addEventListener('error', e => fail('Error: ' + e.message));

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a0710');

// Cheap image-based lighting; the materials are flat matte plastic, so this is plenty.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.4, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;

// Warm gold key from upper-left + bone rim, echoing the render.
const key = new THREE.DirectionalLight(0xf4d68c, 2.6); key.position.set(-6,5,5); scene.add(key);
const rim = new THREE.DirectionalLight(0xf5efe2, 0.7); rim.position.set(5,3,-5); scene.add(rim);
scene.add(new THREE.AmbientLight(0xf4d68c, 0.16));

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// Emissive threads/bulb are geometry; the glow has to come from post.
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.6, 0.85));

const draco = new DRACOLoader().setDecoderPath('https://unpkg.com/three@0.170.0/examples/jsm/libs/draco/');
const loader = new GLTFLoader().setDRACOLoader(draco);

loader.load('./stack.glb', (gltf) => {
  const root = gltf.scene;
  scene.add(root);

  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const ctr  = box.getCenter(new THREE.Vector3());
  root.position.sub(ctr);                     // centre it on the origin
  controls.target.set(0, 0, 0);
  camera.position.set(0, size.y * 0.16, size.y * 2.35);
  controls.update();

  let calls = 0, tris = 0;
  root.traverse(o => { if (o.isMesh) { calls++; tris += o.geometry.index.count/3; } });
  hud.textContent = `drag to orbit · scroll to zoom
${calls} draw calls · ${tris.toLocaleString()} tris · 184 KB`;
}, undefined, (e) => fail('Failed to load stack.glb\n\n' + e));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => { controls.update(); composer.render(); });
</script>
</body>
</html>
